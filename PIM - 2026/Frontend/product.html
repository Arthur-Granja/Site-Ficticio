<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | TechStore</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .product-page {

            display: flex;

            gap: 3rem;

            background: var(--card-bg);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 2rem;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            align-items: center;
        }

        .product-image {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .product-image img {

            width: 100%;

            max-width: 400px;

            height: 400px;

            object-fit: contain;

            background: white;

            border-radius: 16px;

            padding: 20px;
        }

        .product-info {

            flex: 1;
        }

        .product-info h1 {

            font-size: 2.2rem;

            margin-bottom: 1rem;
        }

        .descricao {

            color: gray;

            line-height: 1.6;

            margin-bottom: 2rem;
        }

        .preco {

            font-size: 2rem;

            font-weight: bold;

            color: var(--accent);

            margin-bottom: 1rem;
        }

        .estoque {

            margin-bottom: 2rem;

            font-weight: bold;
        }

        .buttons {

            display: flex;

            flex-direction: column;

            gap: 1rem;
        }

        .buttons button {

            width: 100%;
        }

        @media(max-width: 900px) {

            .product-page {

                flex-direction: column;
            }

            .product-image img {

                height: 300px;
            }
        }

    </style>

</head>

<body>

    <header>

        <h2 class="logo">
            🛒 TechStore
        </h2>

        <div class="top-buttons">

            <button class="btn btn-outline" onclick="alternarTema()">
                🌓 Tema
            </button>

            <button class="btn btn-primary" onclick="irCarrinho()">
                🛒 Carrinho
            </button>

            <button class="btn btn-primary" onclick="logout()">
                🚪 Sair
            </button>

        </div>

    </header>

    <aside>

        <ul class="side-nav">

            <li>
                <button onclick="window.location.href='index.html'">
                    🏠 Home
                </button>
            </li>

            <li>
                <button onclick="window.location.href='meusPedidos.html'">
                    📦 Pedidos
                </button>
            </li>

            <li>
                <button onclick="irCarrinho()">
                    🛒 Carrinho
                </button>
            </li>

        </ul>

    </aside>

    <main>

        <div id="produto"></div>

    </main>

    <script>

        const API = "https://localhost:7171/api/Produtos";

        const id = new URLSearchParams(window.location.search).get("id");

        fetch(API)
        .then(res => res.json())
        .then(produtos => {

            const p = produtos.find(x => x.id == id);

            document.getElementById("produto").innerHTML = `

                <div class="product-page">

                    <div class="product-image">

                        <img src="${p.imagemUrl}" alt="${p.nome}">

                    </div>

                    <div class="product-info">

                        <h1>${p.nome}</h1>

                        <p class="descricao">
                            ${p.descricao}
                        </p>

                        <div class="preco">
                            R$ ${p.preco}
                        </div>

                        <div class="estoque">
                            📦 Estoque disponível: ${p.quantidade}
                        </div>

                        <div class="buttons">

                            <button 
                                class="btn btn-primary"
                                onclick="addCarrinho()"
                            >
                                🛒 Adicionar ao Carrinho
                            </button>

                            <button 
                                class="btn btn-outline"
                                onclick="history.back()"
                            >
                                ← Voltar
                            </button>

                        </div>

                    </div>

                </div>

            `;

            window.addCarrinho = function () {

                let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

                carrinho.push(p);

                localStorage.setItem("carrinho", JSON.stringify(carrinho));

                alert("Produto adicionado ao carrinho!");
            }

        });

        function alternarTema() {

            const html = document.documentElement;

            const temaAtual = html.getAttribute('data-theme');

            if (temaAtual === 'dark') {

                html.setAttribute('data-theme', 'light');

            } else {

                html.setAttribute('data-theme', 'dark');
            }
        }

        function irCarrinho() {

            window.location.href = "carrinho.html";
        }

        function logout() {

            localStorage.removeItem("usuario");

            window.location.href = "login.html";
        }

    </script>

</body>

</html>
