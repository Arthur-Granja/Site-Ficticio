<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | TechStore</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .cart-container {

            max-width: 1200px;

            margin: auto;
        }

        .cart-title {

            margin-bottom: 2rem;
        }

        .cart-grid {

            display: grid;

            grid-template-columns: 2fr 1fr;

            gap: 2rem;
        }

        .cart-items {

            display: flex;

            flex-direction: column;

            gap: 1rem;
        }

        .cart-item {

            background: var(--card-bg);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 1rem;

            display: flex;

            gap: 1rem;

            align-items: center;
        }

        .cart-item img {

            width: 120px;

            height: 120px;

            object-fit: contain;

            background: white;

            border-radius: 12px;

            padding: 10px;
        }

        .cart-info {

            flex: 1;
        }

        .cart-info h3 {

            margin-bottom: 0.5rem;
        }

        .cart-info p {

            margin-bottom: 0.7rem;

            color: gray;
        }

        .preco {

            color: var(--accent);

            font-size: 1.3rem;

            font-weight: bold;
        }

        .summary {

            background: var(--card-bg);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 2rem;

            height: fit-content;

            position: sticky;

            top: 100px;
        }

        .summary h2 {

            margin-bottom: 2rem;
        }

        .summary-total {

            font-size: 2rem;

            font-weight: bold;

            color: var(--accent);

            margin-bottom: 2rem;
        }

        .empty-cart {

            background: var(--card-bg);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 3rem;

            text-align: center;
        }

        @media(max-width: 900px) {

            .cart-grid {

                grid-template-columns: 1fr;
            }

            .cart-item {

                flex-direction: column;

                text-align: center;
            }

            .cart-item img {

                width: 100%;

                max-width: 250px;
            }
        }

    </style>

</head>

<body>

    <header>

        <h2 class="logo">
            🛒 TechStore
        </h2>

        <div class="top-buttons">

            <button class="btn btn-outline" onclick="alternarTema()">
                🌓 Tema
            </button>

            <button class="btn btn-primary" onclick="window.location.href='index.html'">
                🏠 Home
            </button>

            <button class="btn btn-primary" onclick="logout()">
                🚪 Sair
            </button>

        </div>

    </header>

    <aside>

        <ul class="side-nav">

            <li>
                <button onclick="window.location.href='index.html'">
                    🏠 Home
                </button>
            </li>

            <li>
                <button onclick="window.location.href='meusPedidos.html'">
                    📦 Pedidos
                </button>
            </li>

            <li>
                <button onclick="window.location.href='index.html'">
                    💻 Produtos
                </button>
            </li>

        </ul>

    </aside>

    <main>

        <div class="cart-container">

            <h1 class="cart-title">
                🛒 Seu Carrinho
            </h1>

            <div id="conteudo-carrinho"></div>

        </div>

    </main>

    <script>

        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        const container = document.getElementById("conteudo-carrinho");

        if (carrinho.length === 0) {

            container.innerHTML = `

                <div class="empty-cart">

                    <h2>
                        Seu carrinho está vazio 😢
                    </h2>

                    <p style="margin-top: 1rem; margin-bottom: 2rem;">
                        Adicione produtos para continuar comprando.
                    </p>

                    <button 
                        class="btn btn-primary"
                        onclick="window.location.href='index.html'"
                    >
                        🛍️ Ver Produtos
                    </button>

                </div>

            `;

        } else {

            let total = 0;

            let itensHTML = "";

            carrinho.forEach((p, index) => {

                total += p.preco;

                itensHTML += `

                    <div class="cart-item">

                        <img src="${p.imagemUrl}" alt="${p.nome}">

                        <div class="cart-info">

                            <h3>${p.nome}</h3>

                            <p>
                                ${p.descricao}
                            </p>

                            <div class="preco">
                                R$ ${p.preco}
                            </div>

                        </div>

                        <button 
                            class="btn btn-outline"
                            onclick="remover(${index})"
                        >
                            🗑️ Remover
                        </button>

                    </div>

                `;
            });

            container.innerHTML = `

                <div class="cart-grid">

                    <div class="cart-items">

                        ${itensHTML}

                    </div>

                    <div class="summary">

                        <h2>
                            Resumo do Pedido
                        </h2>

                        <div class="summary-total">

                            R$ ${total.toFixed(2)}

                        </div>

                        <button 
                            class="btn btn-primary"
                            style="width: 100%;"
                            onclick="finalizarCompra()"
                        >
                            🧾 Finalizar Compra
                        </button>

                    </div>

                </div>

            `;
        }

        function remover(index) {

            carrinho.splice(index, 1);

            localStorage.setItem("carrinho", JSON.stringify(carrinho));

            location.reload();
        }

        function finalizarCompra() {

            let usuario = JSON.parse(localStorage.getItem("usuario"));

            let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

            let itens = carrinho.map(p => ({
                produtoId: p.id,
                quantidade: 1
            }));

            fetch("https://localhost:7171/api/Pedidos/finalizar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuarioId: usuario.id,
                    itens: itens
                })

            })
            .then(r => r.json())
            .then(res => {

                alert(res.mensagem);

                localStorage.removeItem("carrinho");

                window.location.reload();
            })
            .catch(() => alert("Erro na compra"));
        }

        function alternarTema() {

            const html = document.documentElement;

            const temaAtual = html.getAttribute('data-theme');

            if (temaAtual === 'dark') {

                html.setAttribute('data-theme', 'light');

            } else {

                html.setAttribute('data-theme', 'dark');
            }
        }

        function logout() {

            localStorage.removeItem("usuario");

            window.location.href = "login.html";
        }

    </script>

</body>

</html>
