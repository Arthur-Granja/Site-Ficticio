<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - TechStore</title>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent: #007bff;
            --accent-hover: #0056b3;
            --border: #dddddd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        header {
            background: linear-gradient(135deg, #007bff, #339cff);

            color: white;

            padding: 1rem 2rem;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        header h2 {
            font-size: 1.5rem;
        }

        .btn {
            border: none;

            border-radius: 8px;

            padding: 0.8rem 1.2rem;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .btn-primary {
            background: white;
            color: #007bff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .pedido {
            background: var(--card-bg);

            border-radius: 16px;

            padding: 1.5rem;

            margin-bottom: 1.5rem;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

            border: 1px solid var(--border);
        }

        .pedido-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 1rem;

            flex-wrap: wrap;

            gap: 10px;
        }

        .pedido h3 {
            color: #007bff;
        }

        .pedido-info {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .itens {
            margin-top: 1rem;
        }

        .item {
            background: #f8f9fc;

            border-radius: 10px;

            padding: 1rem;

            margin-bottom: 0.8rem;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;

            gap: 10px;
        }

        .produto-nome {
            font-weight: bold;
        }

        .preco {
            color: #007bff;
            font-weight: bold;
        }

        .vazio {
            background: white;

            padding: 2rem;

            border-radius: 16px;

            text-align: center;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        @media(max-width: 768px) {

            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .pedido-topo {
                flex-direction: column;
                align-items: flex-start;
            }

            .item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>

        <h2>📦 Meus Pedidos</h2>

        <button class="btn btn-primary" onclick="voltar()">
            ⬅ Voltar
        </button>

    </header>

    <div class="container" id="lista"></div>

    <script>

        let usuario = JSON.parse(localStorage.getItem("usuario"));

        if (!usuario) {

            window.location.href = "login.html";
        }

        fetch(`https://localhost:7171/api/Pedidos/meus-pedidos/${usuario.id}`)

        .then(r => r.json())

        .then(pedidos => {

            let container = document.getElementById("lista");

            if (pedidos.length === 0) {

                container.innerHTML = `
                    <div class="vazio">
                        <h2>😢 Você ainda não fez compras</h2>

                        <p style="margin-top: 1rem;">
                            Explore nossos produtos e faça seu primeiro pedido.
                        </p>

                        <button 
                            class="btn btn-primary"
                            style="margin-top: 1.5rem;"
                            onclick="window.location.href='index.html'"
                        >
                            🛒 Ir às Compras
                        </button>
                    </div>
                `;

                return;
            }

            pedidos.forEach(p => {

                let htmlItens = "";

                p.itens.forEach(i => {

                    htmlItens += `

                        <div class="item">

                            <div>
                                <div class="produto-nome">
                                    🛒 ${i.nomeProduto}
                                </div>

                                <div>
                                    Quantidade: ${i.quantidade}
                                </div>
                            </div>

                            <div class="preco">
                                R$ ${Number(i.precoUnitario).toFixed(2)}
                            </div>

                        </div>

                    `;
                });

                container.innerHTML += `

                    <div class="pedido">

                        <div class="pedido-topo">

                            <h3>
                                Pedido #${p.id}
                            </h3>

                            <div class="preco">
                                Total: R$ ${Number(p.total).toFixed(2)}
                            </div>

                        </div>

                        <div class="pedido-info">

                            <p>
                                📅 Data: 
                                ${new Date(p.data).toLocaleString('pt-BR')}
                            </p>

                            <p>
                                📦 Quantidade de itens: ${p.itens.length}
                            </p>

                        </div>

                        <div class="itens">

                            ${htmlItens}

                        </div>

                    </div>

                `;
            });

        })

        .catch(() => {

            document.getElementById("lista").innerHTML = `

                <div class="vazio">

                    <h2>❌ Erro ao carregar pedidos</h2>

                    <p style="margin-top: 1rem;">
                        Tente novamente mais tarde.
                    </p>

                </div>

            `;
        });

        function voltar() {

            window.location.href = "index.html";
        }

    </script>

</body>

</html>
